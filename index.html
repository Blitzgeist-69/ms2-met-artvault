<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Meta tags for SEO -->
        <meta
            name="description"
            content="Explore over 470,000 artworks from The Metropolitan Museum of Art. Search, discover, and save your favourite pieces in your personal Art Vault."
        />
        <meta
            name="keywords"
            content="Met Art Vault, Metropolitan Museum of Art, Met Museum API, art search engine, online art collection, explore artworks, save art favourites, digital art gallery, public domain art, New York museum"
        />

        <!-- Title -->
        <title>Met Art Vault</title>

        <!-- Google Fonts -->
        <!-- Preconnect for faster loading -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@700&display=swap"
            rel="stylesheet"
        />

        <!-- FontAwesome kit -->
        <script src="https://kit.fontawesome.com/5c6ebc3ae9.js" crossorigin="anonymous"></script>

        <!-- Bootstrap 5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <!-- Custom CSS -->
        <link href="assets/css/style.css" rel="stylesheet" />

        <!-- Favicon using favicon.io -->
        <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" />
        <link rel="manifest" href="assets/favicon/site.webmanifest" />
    </head>
    <body>
        <!-- Navigation Bar -->
        <nav class="navbar navbar-expand-lg border-bottom py-3">
            <div class="container">
                <!-- Logo -->
                <a id="logo" class="navbar-brand fw-bold fs-4" href="#">Met Art Vault</a>

                <!-- Hamburger -->
                <button
                    class="navbar-toggler btn-accent"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menu -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div
                        class="ms-auto d-flex flex-column flex-lg-row align-items-start align-items-lg-center border rounded px-3 py-2 mt-3 mt-lg-0 nav-links-box"
                    >
                        <a href="#" class="nav-link px-3 py-1 btn-accent">Home</a>
                        <a href="#" class="nav-link px-3 py-1 btn-accent">Art Vault</a>
                        <a href="#" class="nav-link px-3 py-1 btn-accent">About</a>

                        <button
                            id="dark-mode-toggle"
                            class="nav-link px-3 py-1 btn-accent text-start"
                        >
                            Dark Mode
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Hero Scection -->
        <header class="py-5 text-center border-bottom">
            <div class="container">
                <!-- Headline -->
                <h1 class="display-5 fw-bold">
                    Explore the N.Y.<br />
                    Metropolitan Museum of Art
                </h1>

                <!-- Search and Surprise Me Button -->
                <div class="d-flex justify-content-center align-items-center gap-2 mt-4">
                    <!-- Search Bar -->
                    <form id="search-form" class="d-flex" style="max-width: 320px; width: 100%">
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="fas fa-search"></i>
                            </span>
                            <input
                                type="text"
                                id="search-input"
                                class="form-control"
                                placeholder="search"
                            />
                        </div>
                    </form>

                    <!-- Surprise Me Button -->
                    <button id="random-btn" class="btn btn-accent px-4">Surprise Me!</button>
                </div>
            </div>
        </header>
        <!-- Main Content -->
        <main class="container py-5">
            <div id="results" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                <!-- Cards will be added here by JavaScript -->
                <div class="col-12 text-center" id="placeholder">
                    <p class="lead text-center">
                        Use the search bar or "Surprise Me!" to explore artworks.
                    </p>
                </div>
            </div>
        </main>
        <!-- Modal -->
        <div class="modal fade" id="artModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modal-title">Artwork Name</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6">
                                <img id="modal-image" class="img-fluid rounded" alt="Artwork" />
                            </div>
                            <div class="col-md-6">
                                <p><strong>Artist:</strong> <span id="modal-artist"></span></p>
                                <p><strong>Date:</strong> <span id="modal-date"></span></p>
                                <p><strong>Medium:</strong> <span id="modal-medium"></span></p>
                                <p>
                                    <strong>Department:</strong> <span id="modal-department"></span>
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button id="save-to-vault" class="btn btn-accent">
                            Save to Art Vault
                        </button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
            crossorigin="anonymous"
        ></script>
        <script src="assets/js/script.js"></script>
    </body>
</html>
